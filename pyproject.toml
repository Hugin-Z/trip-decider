[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "trip-decider"
version = "0.1.0"
description = "Evidence-constrained travel planning agent for real-world decisions."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Hugin-Z"}]
keywords = ["ai-agent", "evidence", "mcp", "travel-planner"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "mcp==2.0.0",
    "PyYAML==6.0.3",
    "jsonschema[format-nongpl]==4.26.0",
]

[project.urls]
Homepage = "https://github.com/Hugin-Z/trip-decider"
Repository = "https://github.com/Hugin-Z/trip-decider"
Issues = "https://github.com/Hugin-Z/trip-decider/issues"

[project.optional-dependencies]
dev = [
    "pyright==1.1.411",
    "pytest==9.0.2",
    "ruff==0.16.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trip_decider = ["*.html"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"src/trip_decider/mcp_server.py" = ["E402"]

[tool.pyright]
include = [
    "src/trip_decider/agent_actions.py",
    "src/trip_decider/itinerary_planner.py",
    "src/trip_decider/mcp_adapter.py",
    "src/trip_decider/travel_agent.py",
    "src/trip_decider/trip_application.py",
    "src/trip_decider/trip_query.py",
]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "off"
reportAttributeAccessIssue = "error"
reportMissingImports = "error"
reportPossiblyUnboundVariable = "error"
reportUndefinedVariable = "error"
reportUnreachable = "error"
reportUnsupportedDunderAll = "error"
