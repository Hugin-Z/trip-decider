<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>trip-decider · 旅行规划工作台</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="trip-decider 首页">
      <span class="brand-mark">td</span>
      <span>
        <strong>trip-decider</strong>
        <small>旅行决策工作台</small>
      </span>
    </a>
  </header>

  <main class="app-shell">
    <section id="landing" class="landing">
      <div class="landing-card">
        <p class="eyebrow">新建旅行任务</p>
        <h1>从这次需求开始</h1>
        <p>用一句话说明出发地、时间、人数、预算和目的地倾向。系统会先让你确认结构化条件。</p>
        <label class="trip-prompt-label" for="new-trip-text">旅行需求</label>
        <textarea
          id="new-trip-text"
          rows="5"
          placeholder="例如：从某地出发，某天中午以后可以走，两个人，预算……"
        ></textarea>
        <button class="button primary" type="button" id="new-trip-button">
          创建新任务
        </button>
        <p class="page-status" id="landing-status" role="status"></p>
        <section class="history-panel">
          <div class="history-heading">
            <h2>历史行程</h2>
            <a id="continue-last-link" class="button secondary hidden" href="/">继续上一次行程</a>
          </div>
          <div id="history-list" class="history-list"></div>
        </section>
      </div>
    </section>

    <section id="confirmation" class="confirmation hidden" aria-live="polite">
      <article class="confirmation-card">
        <p class="eyebrow">需求确认</p>
        <h1>请确认这次旅行条件</h1>
        <p class="section-copy">
          可直接补充或修改以下条件。字段完整并确认后，系统才会开始调用工具。
        </p>
        <form id="intent-form" class="intent-form">
          <div id="intent-summary" class="intent-summary"></div>
        </form>
        <section id="missing-panel" class="missing-panel hidden">
          <h2>还需要补充</h2>
          <ul id="missing-questions"></ul>
          <p>请直接在上方补充，完成后即可确认。</p>
        </section>
        <div class="action-row">
          <button class="button primary" type="button" id="confirm-button">
            确认并开始
          </button>
        </div>
        <p class="page-status" id="confirmation-status" role="status"></p>
      </article>
    </section>

    <section id="compact-progress" class="compact-progress hidden" aria-live="polite">
      <div
        class="compact-progress-track"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <span id="compact-progress-fill"></span>
      </div>
      <strong id="compact-progress-percent">0%</strong>
      <span id="compact-progress-task">理解旅行需求</span>
      <span id="compact-progress-elapsed">已用 0 秒</span>
    </section>

    <section id="workbench" class="workbench hidden" aria-live="polite">
      <aside class="intent-column">
        <div class="column-heading">
          <span>已确认条件</span>
          <strong id="mode-label"></strong>
        </div>
        <div id="confirmed-intent" class="panel"></div>
        <button class="button secondary full-width" type="button" id="edit-button">
          返回修改
        </button>
      </aside>

      <section id="map-column" class="map-column hidden" aria-label="每日路线地图">
        <div class="column-heading">
          <span>地图与路线</span>
          <strong id="map-plan-version"></strong>
        </div>
        <div class="map-panel">
          <div id="map-day-tabs" class="map-day-tabs" aria-label="选择地图日期"></div>
          <p id="map-status" class="map-status" role="status"></p>
          <div id="map-canvas" class="map-canvas hidden" aria-label="高德地图"></div>
          <div id="railway-map-cards" class="railway-map-cards"></div>
          <div id="map-missing-geometry" class="map-missing-geometry"></div>
        </div>
      </section>

      <aside id="result-column" class="output-column hidden">
        <div class="column-heading">
          <span>规划结果</span>
          <strong id="result-status"></strong>
        </div>
        <div id="result-area" class="result-area"></div>
      </aside>
    </section>
  </main>

  <script src="/assets/app.js" defer></script>
</body>
</html>
