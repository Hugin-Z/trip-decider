<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>trip-decider · 旅行规划工作台</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="trip-decider 首页">
      <span class="brand-mark">td</span>
      <span>
        <strong>trip-decider</strong>
        <small>旅行决策工作台</small>
      </span>
    </a>
    <span class="runtime-pill" id="runtime-status">等待 Codex</span>
  </header>

  <main class="app-shell">
    <section id="landing" class="landing">
      <div class="landing-card">
        <h1>请从 Codex 发起任务</h1>
        <p class="page-status" id="landing-status" role="status"></p>
      </div>
    </section>

    <section id="confirmation" class="confirmation hidden" aria-live="polite">
      <article class="confirmation-card">
        <p class="eyebrow">需求确认</p>
        <h1>请确认这次旅行条件</h1>
        <p class="section-copy">
          可直接补充或修改以下条件。字段完整并确认后，系统才会开始调用工具。
        </p>
        <form id="intent-form" class="intent-form">
          <div id="intent-summary" class="intent-summary"></div>
        </form>
        <section id="missing-panel" class="missing-panel hidden">
          <h2>还需要补充</h2>
          <ul id="missing-questions"></ul>
          <p>请直接在上方补充，完成后即可确认。</p>
        </section>
        <div class="action-row">
          <button class="button primary" type="button" id="confirm-button">
            确认并开始
          </button>
        </div>
        <p class="page-status" id="confirmation-status" role="status"></p>
      </article>
    </section>

    <section id="workbench" class="workbench hidden" aria-live="polite">
      <aside class="intent-column">
        <div class="column-heading">
          <span>已确认条件</span>
          <strong id="mode-label"></strong>
        </div>
        <div id="confirmed-intent" class="panel"></div>
        <button class="button secondary full-width" type="button" id="edit-button">
          返回修改
        </button>
      </aside>

      <section class="progress-column">
        <div class="column-heading">
          <span>规划进度</span>
          <strong id="run-status">准备开始</strong>
        </div>

        <ol class="progress-grid" id="progress-grid">
          <li data-step="understand" data-state="waiting">
            <span>1</span><strong>理解需求</strong><em>等待</em>
          </li>
          <li data-step="collect" data-state="waiting">
            <span>2</span><strong>查询真实数据</strong><em>等待</em>
          </li>
          <li data-step="validate" data-state="waiting">
            <span>3</span><strong>验证可行性</strong><em>等待</em>
          </li>
          <li data-step="plan" data-state="waiting">
            <span>4</span><strong>生成行程</strong><em>等待</em>
          </li>
        </ol>

        <div class="run-message" id="run-message">
          <span class="working-dot"></span>
          <p>确认后开始执行。</p>
        </div>

        <details class="execution-details">
          <summary>执行详情</summary>
          <div id="event-stream" class="event-stream"></div>
        </details>
      </section>

      <aside id="result-column" class="output-column hidden">
        <div class="column-heading">
          <span>规划结果</span>
          <strong id="result-status"></strong>
        </div>
        <div id="result-area" class="result-area"></div>
      </aside>
    </section>
  </main>

  <script src="/assets/app.js" defer></script>
</body>
</html>
