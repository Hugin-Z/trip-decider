<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trip Decider</title>
  <style>
    :root {
      color-scheme: light dark;
      --surface: light-dark(#ffffff, #171a1f);
      --surface-soft: light-dark(#f4f6f8, #22262d);
      --text: light-dark(#17202a, #f2f5f8);
      --muted: light-dark(#667085, #aab4c3);
      --line: light-dark(#d8dee7, #39414d);
      --accent: #156b55;
      --accent-soft: light-dark(#e6f4ef, #173c32);
      --warning: light-dark(#8a4b08, #ffd29c);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI",
        "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: transparent; }
    button, input, select, textarea { font: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible,
    textarea:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 42%, transparent); outline-offset: 2px; }
    .app { display: grid; gap: 14px; padding: 12px; min-width: 0; }
    .app.full { max-width: 1180px; margin: 0 auto; }
    .toolbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .title { margin: 0; font-size: 1.15rem; }
    .subtitle, .muted { color: var(--muted); }
    .subtitle { margin: 3px 0 0; font-size: .88rem; }
    .button { border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--text); padding: 8px 12px; cursor: pointer; }
    .button.primary { background: var(--accent); color: white; border-color: var(--accent); }
    .button:disabled { cursor: wait; opacity: .58; }
    .cards { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 12px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x proximity; }
    .card, .panel { border: 1px solid var(--line); border-radius: 13px; background: var(--surface); padding: 14px; }
    .card { scroll-snap-align: start; display: grid; gap: 11px; align-content: start; }
    .card h3, .panel h3, .day h3 { margin: 0; }
    .status { display: inline-flex; width: fit-content; border-radius: 999px; background: var(--accent-soft); padding: 4px 8px; font-size: .78rem; }
    .evidence-badge { border: 1px solid var(--line); border-radius: 9px; background: var(--surface-soft); overflow: hidden; }
    .evidence-badge summary { display: flex; align-items: center; gap: 7px; cursor: pointer; padding: 6px 8px; font-size: .78rem; }
    .evidence-badge summary::marker { color: var(--muted); }
    .token { border-radius: 999px; padding: 3px 7px; font-weight: 650; background: #7b8492; color: #fff; }
    .token[data-token="verified"] { background: #18794e; }
    .token[data-token="sourced_stale"],
    .token[data-token="sourced_undated"],
    .token[data-token="estimated"],
    .token[data-token="estimated_stale"],
    .token[data-token="estimated_undated"] { background: #9a6700; }
    .token[data-token="conflicting"] { background: #c9372c; }
    .token[data-token="unknown"] { background: #667085; }
    .evidence-detail { display: grid; gap: 5px; border-top: 1px solid var(--line); padding: 8px; font-size: .79rem; color: var(--muted); }
    .evidence-detail p { margin: 0; }
    dl { display: grid; grid-template-columns: minmax(88px, auto) 1fr; gap: 6px 10px; margin: 0; font-size: .87rem; }
    dt { color: var(--muted); }
    dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
    ul { margin: 7px 0 0; padding-left: 20px; }
    .plan-grid { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(230px, .8fr); gap: 14px; align-items: start; }
    .timeline { display: grid; gap: 12px; }
    .day { border-left: 3px solid var(--accent); padding: 2px 0 2px 14px; }
    .events { display: grid; gap: 8px; margin-top: 10px; }
    .event { display: grid; grid-template-columns: 94px minmax(0, 1fr); gap: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
    .event:first-child { border-top: 0; }
    .event time { color: var(--muted); font-variant-numeric: tabular-nums; }
    .event strong { display: block; }
    .event p { margin: 3px 0 0; color: var(--muted); font-size: .84rem; }
    .sidebar { display: grid; gap: 12px; }
    .data-table { width: 100%; border-collapse: collapse; font-size: .84rem; }
    .data-table th, .data-table td { border-top: 1px solid var(--line); padding: 8px 6px; text-align: left; vertical-align: top; }
    .data-table th { color: var(--muted); font-weight: 600; }
    .data-table thead th { border-top: 0; }
    .diff-value { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
    .diff-claim, .diff-observed { border-radius: 6px; padding: 5px 6px; overflow-wrap: anywhere; }
    .diff-claim { background: light-dark(#fff1f0, #4a2422); }
    .diff-observed { background: light-dark(#e8f5ee, #173d2d); }
    .route { border-top: 1px solid var(--line); padding: 8px 0; }
    .route:first-of-type { border-top: 0; }
    .route small { display: block; color: var(--muted); margin-top: 3px; }
    .revision { display: grid; gap: 9px; }
    .revision label { display: grid; gap: 5px; font-size: .84rem; color: var(--muted); }
    .revision select, .revision textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); padding: 8px; }
    .revision textarea { resize: vertical; min-height: 64px; }
    .notice { border-radius: 10px; background: var(--surface-soft); padding: 10px 12px; color: var(--muted); }
    /* 证据事实卡片：next_action.detail 落在卡片内部，不进全局提示区
       （docs/contracts/invariants.md I3b）。blocking 与非 blocking 要能一眼分开。 */
    .evidence-fact { border-top: 1px solid var(--line); padding: 8px 0; display: grid; gap: 4px; }
    .evidence-fact:first-of-type { border-top: 0; }
    .evidence-facts { display: grid; gap: 2px; margin-top: 8px; }
    .next-action { margin: 0; font-size: 0.85rem; color: var(--muted); }
    .next-action.blocking { color: #8a3a1a; font-weight: 600; }
    .next-action-options { margin: 2px 0 0 1rem; font-size: 0.85rem; color: var(--muted); }
    .notice.error { color: var(--warning); }
    .map-figure { display: grid; gap: 7px; margin: 0; }
    .map-figure figcaption { color: var(--muted); font-size: .78rem; }
    .map-canvas { width: 100%; min-height: 190px; border: 1px solid var(--line); border-radius: 10px; background: light-dark(#f7faf9, #101b18); }
    .map-line { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; opacity: .82; }
    .map-line.schematic { stroke-dasharray: 6 5; }
    .map-point { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
    .map-label { fill: var(--text); font-size: 10px; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
    .verification-progress { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .verification-progress .status { background: var(--surface-soft); }
    .diff-list { font-size: .86rem; }
    .hidden { display: none !important; }
    @media (max-width: 760px) {
      .plan-grid { grid-template-columns: 1fr; }
      .cards { grid-auto-columns: minmax(230px, 88vw); }
      .event { grid-template-columns: 78px minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <main id="app" class="app" aria-live="polite" data-render-state="degraded">
    <section class="panel local-fallback">
      <h2 class="title">旅行视图暂未收到宿主数据</h2>
      <p class="subtitle">完整结构化结果仍保留在本次工具返回中。</p>
      <p class="subtitle">若数据稍后到达将自动刷新。</p>
    </section>
  </main>
  <script>
    (() => {
      "use strict";
      const app = document.getElementById("app");
      let busy = false;
      let rpcId = 0;
      let hostContext = null;
      let hasRendered = false;
      const pending = new Map();
      const appConfig = (
        window.tripDeciderAppConfig
        && typeof window.tripDeciderAppConfig === "object"
      ) ? window.tripDeciderAppConfig : {};
      const timeoutOr = (value, fallback) => (
        typeof value === "number" && Number.isFinite(value) && value > 0
          ? value
          : fallback
      );
      const DEFAULT_FIRST_RENDER_TIMEOUT_MS = 5000;
      const FIRST_RENDER_TIMEOUT_MS = timeoutOr(
        appConfig.firstRenderTimeoutMs,
        DEFAULT_FIRST_RENDER_TIMEOUT_MS,
      );
      const BRIDGE_TIMEOUT_MS = timeoutOr(
        appConfig.bridgeTimeoutMs,
        FIRST_RENDER_TIMEOUT_MS,
      );
      app.dataset.firstRenderTimeoutMs = String(FIRST_RENDER_TIMEOUT_MS);

      const element = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = String(text);
        return node;
      };
      const finite = (value) => typeof value === "number" && Number.isFinite(value);
      const money = (value) => finite(value) ? `¥${value.toLocaleString("zh-CN")}` : "待核验";
      const duration = (seconds) => {
        if (!finite(seconds)) return "待核验";
        const minutes = Math.round(seconds / 60);
        const hours = Math.floor(minutes / 60);
        const rest = minutes % 60;
        return hours ? `${hours}小时${rest ? `${rest}分钟` : ""}` : `${rest}分钟`;
      };
      const clock = (value) => {
        if (typeof value !== "string") return "待定";
        const match = value.match(/T(\d{2}:\d{2})/);
        return match ? match[1] : value;
      };
      const labels = {
        FEASIBLE: "可行",
        CONDITIONALLY_FEASIBLE: "有条件可行",
        INFEASIBLE: "不可行",
        UNKNOWN: "待核验",
        PARTIAL_READY: "条件化行程",
        PLAN_READY: "行程已生成",
      };

      const request = (method, params, timeoutMs = 0) => new Promise((resolve, reject) => {
        const id = ++rpcId;
        let timer = null;
        const finish = (callback) => (value) => {
          if (timer !== null) clearTimeout(timer);
          callback(value);
        };
        pending.set(id, {resolve: finish(resolve), reject: finish(reject)});
        if (timeoutMs > 0) {
          timer = setTimeout(() => {
            pending.delete(id);
            reject(new Error(`${method} timed out`));
          }, timeoutMs);
        }
        try {
          window.parent.postMessage({jsonrpc: "2.0", id, method, params}, "*");
        } catch (error) {
          pending.delete(id);
          if (timer !== null) clearTimeout(timer);
          reject(error);
        }
      });
      const notify = (method, params) => {
        const message = {jsonrpc: "2.0", method};
        if (params !== undefined) message.params = params;
        window.parent.postMessage(message, "*");
      };
      const handleBridgeMessage = (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;
        if (message.id !== undefined && pending.has(message.id)) {
          const item = pending.get(message.id);
          pending.delete(message.id);
          if (message.error) item.reject(message.error);
          else item.resolve(message.result);
          return;
        }
        if (message.method === "ui/notifications/tool-result") {
          renderPayload(
            message.params?.structuredContent
            || message.params?.structured_content,
            "mcp-tool-result",
          );
        }
      };

      // The transport listener must exist before ui/initialize is sent. Claude
      // Desktop can answer the handshake before the rest of this script runs.
      window.addEventListener("message", handleBridgeMessage, {passive: true});

      const startSizeNotifications = () => {
        let scheduled = false;
        const report = () => {
          if (scheduled) return;
          scheduled = true;
          const schedule = typeof requestAnimationFrame === "function"
            ? requestAnimationFrame
            : (callback) => setTimeout(callback, 0);
          schedule(() => {
            scheduled = false;
            notify("ui/notifications/size-changed", {
              width: Math.ceil(window.innerWidth),
              height: Math.ceil(document.documentElement.scrollHeight),
            });
          });
        };
        report();
        if (typeof ResizeObserver === "function") {
          new ResizeObserver(report).observe(document.documentElement);
        }
      };
      const initialize = async () => {
        const result = await request("ui/initialize",
          {
            appInfo: {name: "trip-decider-workspace", version: "1.0.0"},
            appCapabilities: {availableDisplayModes: ["inline", "fullscreen"]},
            protocolVersion: "2026-01-26",
          },
          BRIDGE_TIMEOUT_MS,
        );
        hostContext = result?.hostContext || null;
        notify("ui/notifications/initialized");
        startSizeNotifications();
        return result;
      };
      let bridgeReady = Promise.resolve(null);

      const structured = (response) => response?.structuredContent || response?.structured_content || null;
      const callTool = async (name, args) => {
        const ready = await bridgeReady;
        if (ready) return request("tools/call", {name, arguments: args});
        if (window.openai?.callTool) return window.openai.callTool(name, args);
        throw new Error("host does not expose MCP Apps tool calls");
      };

      const heading = (title, subtitle) => {
        const bar = element("header", "toolbar");
        const copy = element("div");
        copy.append(element("h2", "title", title), element("p", "subtitle", subtitle));
        bar.append(copy);
        const bridgeFullscreen = hostContext?.availableDisplayModes?.includes("fullscreen");
        if (bridgeFullscreen || window.openai?.requestDisplayMode) {
          const expand = element("button", "button", "全屏查看");
          expand.type = "button";
          expand.addEventListener("click", async () => {
            if (bridgeFullscreen) await request("ui/request-display-mode", {mode: "fullscreen"});
            else await window.openai.requestDisplayMode({mode: "fullscreen"});
            app.classList.add("full");
          });
          bar.append(expand);
        }
        return bar;
      };

      const factList = (rows) => {
        const list = element("dl");
        rows.forEach(([name, value]) => {
          list.append(element("dt", "", name), element("dd", "", value));
        });
        return list;
      };

      // UI 只透传读取层给出的 token，不含 support/freshness 判定或 token 映射。
      // 颜色由 CSS 的 data-token 选择器负责；next_action.detail 留在事实内部。
      const evidenceCard = (item) => {
        const card = element("details", "evidence-badge");
        const summary = element("summary");
        summary.append(element("strong", "", item.label || item.domain || "事实"));
        const token = element(
          "span",
          "token",
          typeof item.token === "string" ? item.token : "token 未提供",
        );
        if (typeof item.token === "string") token.dataset.token = item.token;
        summary.append(token);
        if (finite(item.count)) summary.append(element("span", "muted", `${item.count} 项`));
        card.append(summary);
        const detail = element("div", "evidence-detail");
        detail.append(element("p", "", `采集时间：${item.retrieved_at || "未取得"}`));
        const sources = Array.isArray(item.sources) ? item.sources : [];
        detail.append(element(
          "p",
          "",
          `来源：${sources.length ? sources.map((source) => source.provider || "未标明来源").join("、") : "未取得"}`,
        ));
        const action = item.next_action;
        if (action && action.detail) {
          detail.append(element(
            "p",
            action.blocking ? "next-action blocking" : "next-action",
            `下一步：${action.detail}`,
          ));
          if (Array.isArray(action.options) && action.options.length) {
            const choices = element("ul", "next-action-options");
            action.options.forEach((choice) => {
              choices.append(element("li", "", choice.label || choice.option_id));
            });
            detail.append(choices);
          }
        }
        card.append(detail);
        return card;
      };

      const evidencePanel = (statuses) => {
        const panel = element("section", "panel");
        panel.append(element("h3", "", "证据状态"));
        const rows = Array.isArray(statuses) ? statuses : [];
        if (!rows.length) {
          panel.append(element("p", "muted", "本次运行还没有可展示的证据。"));
          return panel;
        }
        rows.forEach((item) => panel.append(evidenceCard(item)));
        return panel;
      };

      const svgElement = (tag) => document.createElementNS("http://www.w3.org/2000/svg", tag);
      const mapPoint = (value) => {
        if (!value || typeof value !== "object") return null;
        const nested = value.position || value.coordinates || value.location || value.center;
        if (nested && nested !== value) {
          const point = mapPoint(nested);
          if (point) return point;
        }
        const longitude = value.longitude ?? value.lon;
        const latitude = value.latitude ?? value.lat;
        if (!finite(longitude) || !finite(latitude)) return null;
        if (longitude < -180 || longitude > 180 || latitude < -90 || latitude > 90) return null;
        return {longitude, latitude};
      };

      // Self-contained SVG: it uses only supplied coordinates and explicit route
      // geometry/endpoints. No tile request, geocoding, or name-to-coordinate guess.
      const mapFigure = (model, title) => {
        const markerRows = Array.isArray(model?.markers) ? model.markers : [];
        const routeRows = Array.isArray(model?.route_polylines) ? model.route_polylines : [];
        const markers = markerRows.map((marker) => ({marker, point: mapPoint(marker.position || marker)})).filter((item) => item.point);
        const markerById = new Map(markers.map((item) => [item.marker.marker_id, item.point]));
        const routes = routeRows.map((route) => {
          const supplied = Array.isArray(route.polyline) ? route.polyline.map(mapPoint).filter(Boolean) : [];
          if (supplied.length >= 2) return {route, points: supplied, schematic: route.geometry_status !== "EXISTING_POLYLINE"};
          const from = markerById.get(route.from_marker_id);
          const to = markerById.get(route.to_marker_id);
          return from && to ? {route, points: [from, to], schematic: true} : null;
        }).filter(Boolean);
        const allPoints = [...markers.map((item) => item.point), ...routes.flatMap((item) => item.points)];
        if (!allPoints.length) return null;
        const width = 720;
        const height = 300;
        const inset = 34;
        const longitudes = allPoints.map((point) => point.longitude);
        const latitudes = allPoints.map((point) => point.latitude);
        const minLon = Math.min(...longitudes);
        const maxLon = Math.max(...longitudes);
        const minLat = Math.min(...latitudes);
        const maxLat = Math.max(...latitudes);
        const lonSpan = Math.max(maxLon - minLon, 0.01);
        const latSpan = Math.max(maxLat - minLat, 0.01);
        const project = (point) => ({
          x: maxLon === minLon
            ? width / 2
            : inset + ((point.longitude - minLon) / lonSpan) * (width - inset * 2),
          y: maxLat === minLat
            ? height / 2
            : height - inset - ((point.latitude - minLat) / latSpan) * (height - inset * 2),
        });
        const palette = ["#156b55", "#3b82f6", "#8b5cf6", "#d97706", "#db2777"];
        const figure = element("figure", "map-figure");
        const svg = svgElement("svg");
        svg.classList.add("map-canvas");
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        svg.setAttribute("role", "img");
        svg.setAttribute("aria-label", title);
        routes.forEach(({route, points, schematic}, index) => {
          const line = svgElement("polyline");
          line.classList.add("map-line");
          if (schematic) line.classList.add("schematic");
          line.setAttribute("points", points.map((point) => {
            const placed = project(point);
            return `${placed.x},${placed.y}`;
          }).join(" "));
          const day = Number(route.day);
          line.style.stroke = palette[Number.isFinite(day) && day > 0 ? (day - 1) % palette.length : index % palette.length];
          svg.append(line);
        });
        markers.forEach(({marker, point}) => {
          const placed = project(point);
          const dot = svgElement("circle");
          dot.classList.add("map-point");
          dot.setAttribute("cx", String(placed.x));
          dot.setAttribute("cy", String(placed.y));
          dot.setAttribute("r", "5");
          const label = svgElement("text");
          label.classList.add("map-label");
          label.setAttribute("x", String(placed.x + 8));
          label.setAttribute("y", String(placed.y - 7));
          label.textContent = marker.display_name || marker.name || "POI";
          svg.append(dot, label);
        });
        figure.append(svg, element("figcaption", "", "GCJ-02 坐标示意；虚线表示只有端点或明确标为示意的连接，不代表真实道路几何。"));
        return figure;
      };

      const renderCandidates = (payload) => {
        app.replaceChildren();
        const model = payload.candidates || {};
        const options = Array.isArray(model.candidates) ? model.candidates : [];
        app.append(heading("目的地方案比较", `${options.length} 个候选 · 选择后继续同一个旅行任务`));
        const cards = element("section", "cards");
        options.forEach((option) => {
          const card = element("article", "card");
          const title = option.name || option.destination_anchor || option.destination_id || "目的地候选";
          const feasibility = option.feasibility_status || option.coarse_feasibility || option.coarse_plan_status || "UNKNOWN";
          const transport = option.roundtrip_transport || {};
          card.append(
            element("h3", "", title),
            element("span", "status", labels[feasibility] || feasibility),
            factList([
              ["往返交通", duration(transport.duration_seconds)],
              ["已知费用", money(transport.known_cost_cny)],
              ["可游玩时间", duration(option.playable_time_seconds)],
              ["当地交通", option.local_transport_difficulty?.value || "待核验"],
              ["主题", Array.isArray(option.themes) && option.themes.length ? option.themes.join("、") : "待核验"],
              ["体力", option.physical_intensity || "待核验"],
              ["预算余量", money(option.budget_headroom_after_known_transport_cny)],
            ])
          );
          const candidateMap = mapFigure(
            payload.candidate_maps?.[option.destination_id],
            `${title} POI 坐标`,
          );
          if (candidateMap) card.append(candidateMap);
          if (Array.isArray(option.evidence_statuses) && option.evidence_statuses.length) {
            const facts = element("div", "evidence-facts");
            option.evidence_statuses.forEach((item) => facts.append(evidenceCard(item)));
            card.append(facts);
          }
          if (Array.isArray(option.evidence_missing) && option.evidence_missing.length) {
            card.append(element("strong", "", "仍缺证据"));
            const missing = element("ul");
            option.evidence_missing.forEach((item) => missing.append(element("li", "", item)));
            card.append(missing);
          }
          const choose = element("button", "button primary", "选择并生成详细行程");
          choose.type = "button";
          choose.addEventListener("click", async () => {
            if (busy) return;
            busy = true;
            choose.disabled = true;
            choose.textContent = "正在生成…";
            try {
              await callTool("select_trip_candidate", {
                run_id: payload.run_id,
                candidate_id: option.destination_id,
              });
              await callTool("advance_trip_task", {run_id: payload.run_id, wait_seconds: 10});
              const response = await callTool("show_trip_plan", {run_id: payload.run_id});
              const next = structured(response);
              if (next) renderPayload(next, "app-tool-call:show_trip_plan");
            } catch (_) {
              const notice = element("div", "notice error", "暂时无法继续该方案。可以在对话中继续推进同一任务。");
              card.append(notice);
              choose.disabled = false;
              choose.textContent = "重试选择";
            } finally {
              busy = false;
            }
          });
          card.append(choose);
          cards.append(card);
        });
        if (!options.length) cards.append(element("div", "notice", "候选尚未准备好，请先推进旅行任务。"));
        app.append(cards);
      };

      const eventDetail = (event) => {
        const parts = [];
        if (typeof event.detail === "string" && event.detail.trim()) parts.push(event.detail.trim());
        const legs = Array.isArray(event.legs) ? event.legs : [];
        legs.forEach((leg) => {
          if (leg.mode === "walk" && finite(leg.distance_meters)) {
            parts.push(`步行 ${Math.round(leg.distance_meters)} 米`);
          } else if (leg.mode === "ride") {
            const service = leg.service || "线路待核验";
            const stops = leg.board_at || leg.alight_at ? `（${leg.board_at || "上车点待核验"} 上车，${leg.alight_at || "下车点待核验"} 下车）` : "";
            const count = finite(leg.stop_count) ? `，${leg.stop_count} 站` : "";
            parts.push(`乘 ${service}${stops}${count}`);
          }
        });
        if (!legs.length && Array.isArray(event.services)) {
          event.services.forEach((service) => {
            parts.push(`乘 ${service.service || "线路待核验"}（${service.board_at || "上车点待核验"} 上车，${service.alight_at || "下车点待核验"} 下车）`);
          });
        }
        if (Array.isArray(event.transfers) && event.transfers.length) {
          const transferText = event.transfers.map((item) => {
            if (!item || typeof item !== "object") return String(item);
            const services = [item.from_service, item.to_service].filter(Boolean).join(" → ");
            const stops = [item.alight_at, item.board_at].filter(Boolean).join(" → ");
            return [services, stops].filter(Boolean).join("（") + (services && stops ? "）" : "");
          }).filter(Boolean);
          if (transferText.length) parts.push(`换乘：${transferText.join("、")}`);
        }
        if (finite(event.headway_minutes)) parts.push(`约每 ${event.headway_minutes} 分钟一班`);
        if (event.first_departure || event.last_departure) {
          parts.push(`运营 ${event.first_departure || "首班待核验"}–${event.last_departure || "末班待核验"}`);
        }
        if (finite(event.duration_seconds)) parts.push(duration(event.duration_seconds));
        if (finite(event.distance_meters)) parts.push(`${(event.distance_meters / 1000).toFixed(1)}公里`);
        if (finite(event.walking_distance_meters)) parts.push(`合计步行${Math.round(event.walking_distance_meters)}米`);
        if (finite(event.planning_allocation_minutes)) parts.push(`游览${event.planning_allocation_minutes}分钟`);
        const amount = event.fare?.amount_cny ?? event.cost?.amount_cny;
        if (finite(amount)) parts.push(money(amount));
        return parts.join(" · ") || event.why || "详情待核验";
      };

      const renderPlan = (payload) => {
        app.replaceChildren();
        const installed = payload.plan || {};
        const plan = installed.plan || {};
        const presentation = payload.trip?.presentation || {};
        const version = installed.plan_version ?? payload.current_version ?? "—";
        app.append(heading("详细行程", `PlanVersion ${version} · ${labels[installed.planning_state] || installed.planning_state || "已安装"}`));
        const grid = element("div", "plan-grid");
        const timeline = element("section", "timeline");
        const days = Array.isArray(plan.days) ? plan.days : [];
        days.forEach((day) => {
          const dayNode = element("article", "day");
          dayNode.append(element("h3", "", `Day ${day.day} · ${day.date || "日期待定"}`));
          const events = element("div", "events");
          (day.events || []).forEach((event) => {
            const row = element("div", "event");
            row.append(element("time", "", `${clock(event.start_at)}–${clock(event.end_at)}`));
            const copy = element("div");
            copy.append(element("strong", "", event.name || "未命名事件"));
            copy.append(element("p", "", eventDetail(event)));
            const projected = payload.event_evidence?.[event.event_id];
            if (Array.isArray(projected?.badges) && projected.badges.length) {
              const badges = element("div", "evidence-facts");
              projected.badges.forEach((badge) => badges.append(evidenceCard(badge)));
              copy.append(badges);
            }
            if (Array.isArray(projected?.unresolved_fact_refs) && projected.unresolved_fact_refs.length) {
              copy.append(element("p", "muted", `${projected.unresolved_fact_refs.length} 条事实引用当前没有可展示投影。`));
            }
            row.append(copy);
            events.append(row);
          });
          if (!events.childElementCount) events.append(element("div", "notice", "当天内容待核验。"));
          dayNode.append(events);
          timeline.append(dayNode);
        });
        if (!days.length) timeline.append(element("div", "notice", "当前没有已安装的可展示行程。"));

        const sidebar = element("aside", "sidebar");
        const budgetPanel = element("section", "panel");
        budgetPanel.append(element("h3", "", "预算"));
        const budgetTable = element("table", "data-table");
        const budgetHead = element("thead");
        const budgetHeadRow = element("tr");
        ["项目", "金额", "状态"].forEach((label) => budgetHeadRow.append(element("th", "", label)));
        budgetHead.append(budgetHeadRow);
        const budgetBody = element("tbody");
        (presentation.budget_summary || []).forEach((item) => {
          const row = element("tr");
          const amounts = [];
          const states = [];
          if (finite(item.known_cny) && item.known_cny > 0) {
            amounts.push(money(item.known_cny));
            states.push("已知");
          }
          if (finite(item.estimated_cny) && item.estimated_cny > 0) {
            amounts.push(money(item.estimated_cny));
            states.push("估算");
          }
          if (item.unknown) states.push("含待核验金额");
          row.append(
            element("td", "", item.label),
            element("td", "", amounts.join(" + ") || "—"),
            element("td", "", states.join(" / ") || "无已知支出"),
          );
          budgetBody.append(row);
        });
        budgetTable.append(budgetHead, budgetBody);
        budgetPanel.append(budgetTable);
        sidebar.append(budgetPanel);

        const missingPanel = element("section", "panel");
        missingPanel.append(element("h3", "", "缺失项与条件"));
        const requirements = presentation.planning_draft?.missing_requirements || [];
        if (requirements.length) {
          const list = element("ul");
          requirements.forEach((item) => list.append(element("li", "", item.reason || item.label || item.domain || String(item))));
          missingPanel.append(list);
        }
        const blockers = presentation.planning_draft?.blockers || presentation.blockers || [];
        if (blockers.length) {
          const list = element("ul");
          blockers.forEach((item) => list.append(element("li", "", item.reason || item.blocker_id || "仍需补充证据")));
          missingPanel.append(list);
        } else if (!requirements.length) {
          missingPanel.append(element("p", "muted", "没有未处理的硬缺失项。"));
        }
        sidebar.append(missingPanel);
        sidebar.append(evidencePanel(presentation.evidence_statuses));

        const planMap = mapFigure(presentation.map_payload, "逐日行程 POI 与路线");
        if (planMap) {
          const mapPanel = element("section", "panel");
          mapPanel.append(element("h3", "", "地图"), planMap);
          sidebar.append(mapPanel);
        }

        const routesPanel = element("section", "panel");
        routesPanel.append(element("h3", "", "路线摘要"));
        const routes = presentation.map_payload?.route_polylines || [];
        routes.forEach((route) => {
          const row = element("div", "route");
          row.append(element("strong", "", `${route.from || "起点"} → ${route.to || "终点"}`));
          row.append(element("small", "", `${route.transport_mode || "方式待核验"} · ${duration(route.duration_seconds)} · ${route.token || "token 未提供"}`));
          routesPanel.append(row);
        });
        if (!routes.length) routesPanel.append(element("p", "muted", "路线数据待核验。"));
        sidebar.append(routesPanel);

        const revisionPanel = element("section", "panel revision");
        revisionPanel.append(element("h3", "", "修改行程"));
        const paceLabel = element("label", "", "旅行节奏");
        const pace = element("select");
        [["relaxed", "轻松"], ["standard", "标准"], ["intensive", "紧凑"]].forEach(([value, label]) => {
          const option = element("option", "", label);
          option.value = value;
          if (plan.constraints?.pace === value) option.selected = true;
          pace.append(option);
        });
        paceLabel.append(pace);
        const messageLabel = element("label", "", "这次希望怎么改");
        const message = element("textarea");
        message.placeholder = "例如：第二天九点以后出发";
        messageLabel.append(message);
        const revise = element("button", "button primary", "生成新版本");
        revise.type = "button";
        revise.addEventListener("click", async () => {
          if (busy) return;
          busy = true;
          revise.disabled = true;
          revise.textContent = "正在修改…";
          try {
            const response = await callTool("revise_trip_plan", {
              run_id: payload.run_id,
              revision: {pace: pace.value, user_message: message.value.trim() || "调整旅行节奏"},
            });
            const next = structured(response);
            if (next?.plan) {
              // 重新走唯一展示入口，取得与新 PlanVersion 对应的读时证据徽章；
              // revise 的结构化结果仍是失败时可保留的完整业务回退。
              try {
                const refreshed = structured(await callTool("show_trip_plan", {run_id: payload.run_id}));
                if (refreshed) renderPayload(
                  refreshed,
                  "app-tool-call:show_trip_plan",
                );
                else renderPlan({view: "plan", run_id: payload.run_id, trip: next.trip, plan: next.plan});
              } catch (_) {
                renderPlan({view: "plan", run_id: payload.run_id, trip: next.trip, plan: next.plan});
                revisionPanel.append(element("div", "notice error", "行程已修改，但证据徽章刷新失败；可在对话中再次打开当前行程。"));
              }
            }
          } catch (_) {
            revisionPanel.append(element("div", "notice error", "本次修改未安装；当前版本保持不变。可在对话中补充修改要求。"));
            revise.disabled = false;
            revise.textContent = "重试修改";
          } finally {
            busy = false;
          }
        });
        revisionPanel.append(paceLabel, messageLabel, revise);

        const diff = plan.revision?.diff;
        if (diff) {
          const diffPanel = element("section", "panel diff-list");
          diffPanel.append(element("h3", "", "相对上一版的变化"));
          const changes = [
            ...(Array.isArray(plan.revision?.changes) ? plan.revision.changes : []),
            ...(Array.isArray(diff.attraction_changes) ? diff.attraction_changes : []),
          ];
          if (changes.length) {
            const list = element("ul");
            changes.forEach((change) => list.append(element("li", "", change.reason || change.type || "行程已调整")));
            diffPanel.append(list);
          } else diffPanel.append(element("p", "muted", "版本已更新，主要行程块未发生可见变化。"));
          sidebar.append(diffPanel);
        }

        sidebar.append(revisionPanel);
        grid.append(timeline, sidebar);
        app.append(grid);
      };

      const compactValue = (value) => {
        if (value === null || value === undefined || value === "") return "—";
        if (typeof value === "object") return JSON.stringify(value, null, 2);
        return String(value);
      };

      const claimText = (claim) => {
        if (!claim || typeof claim !== "object") return "断言内容缺失";
        const route = [claim.origin_station, claim.destination_station].filter(Boolean).join(" → ");
        const parts = [claim.train_code, route, claim.departure_at, finite(claim.price_cny) ? money(claim.price_cny) : null].filter(Boolean);
        return parts.join(" · ") || compactValue(claim);
      };

      const renderVerification = (payload) => {
        app.replaceChildren();
        const summary = payload.summary || {};
        const total = finite(payload.total) ? payload.total : summary.total || 0;
        app.append(heading(
          "行程核验报告",
          `${total} 条：${summary.sourced || 0} sourced / ${summary.conflicting || 0} conflicting / ${summary.unknown || 0} unknown`,
        ));
        const progress = element("section", "panel verification-progress");
        progress.append(
          element("span", "status", `status: ${payload.status || "未提供"}`),
          element("span", "", `已核 ${payload.checked || 0} / ${total}`),
          element("span", "", `待核 ${payload.pending || 0}`),
        );
        if (!payload.terminal && payload.verify_id) {
          const refresh = element("button", "button", "刷新核验进度");
          refresh.type = "button";
          refresh.addEventListener("click", async () => {
            if (busy) return;
            busy = true;
            refresh.disabled = true;
            refresh.textContent = "正在刷新…";
            try {
              const response = await callTool("read_verification", {verify_id: payload.verify_id});
              const next = structured(response);
              if (next) renderVerification(next);
            } catch (_) {
              refresh.disabled = false;
              refresh.textContent = "重试刷新";
              progress.append(element("span", "notice error", "刷新失败；已显示的增量结果仍然有效。"));
            } finally {
              busy = false;
            }
          });
          progress.append(refresh);
        }
        app.append(progress);

        const panel = element("section", "panel");
        const table = element("table", "data-table");
        const head = element("thead");
        const headRow = element("tr");
        ["断言内容", "核验结果", "详情"].forEach((label) => headRow.append(element("th", "", label)));
        head.append(headRow);
        const body = element("tbody");
        const findings = Array.isArray(payload.findings) ? payload.findings : [];
        findings.forEach((finding) => {
          const row = element("tr");
          const claim = element("td", "", claimText(finding.claim));
          const result = element("td");
          result.append(evidenceCard({
            label: `第 ${finding.index || "?"} 条`,
            token: finding.token,
            retrieved_at: finding.retrieved_at,
            sources: finding.sources,
            next_action: finding.next_action,
          }));
          const detail = element("td");
          const mismatches = Array.isArray(finding.mismatches) ? finding.mismatches : [];
          mismatches.forEach((mismatch) => {
            const item = element("div");
            item.append(element("strong", "", mismatch.field || "差异"));
            const pair = element("div", "diff-value");
            pair.append(
              element("div", "diff-claim", `声称：${compactValue(mismatch.claimed)}`),
              element("div", "diff-observed", `实查：${compactValue(mismatch.observed)}`),
            );
            item.append(pair);
            detail.append(item);
          });
          if (!mismatches.length) {
            const observed = finding.observed ? `实查：${compactValue(finding.observed)}` : "没有取得可对照值";
            detail.append(element("p", "", observed));
          }
          if (finding.reason) detail.append(element("p", "muted", `说明：${finding.reason}`));
          if (finding.next_action?.detail) detail.append(element("p", "next-action", `建议：${finding.next_action.detail}`));
          row.append(claim, result, detail);
          body.append(row);
        });
        if (!findings.length) {
          const row = element("tr");
          const cell = element("td", "muted", "结论正在增量到达；刷新后会追加到这里。");
          cell.colSpan = 3;
          row.append(cell);
          body.append(row);
        }
        table.append(head, body);
        panel.append(table);
        app.append(panel, element("p", "muted", payload.scope_note || ""));
      };

      const renderPayload = (payload, channel = "unspecified") => {
        app.dataset.payloadArrivedAt = new Date().toISOString();
        app.dataset.payloadChannel = channel;
        if (!payload || typeof payload !== "object") return false;
        if (payload.view === "candidates" || payload.candidates?.candidates) renderCandidates(payload);
        else if (payload.view === "plan" || payload.plan?.plan) renderPlan(payload);
        else if (payload.view === "verification" || payload.artifact_kind === "ItineraryVerification") renderVerification(payload);
        else return false;
        hasRendered = true;
        app.dataset.renderState = "ready";
        return true;
      };

      const renderLocalFallback = () => {
        if (hasRendered) return;
        const panel = element("section", "panel local-fallback");
        panel.append(
          element("h2", "title", "旅行视图暂未收到宿主数据"),
          element(
            "p",
            "subtitle",
            `交互桥接未在 ${FIRST_RENDER_TIMEOUT_MS / 1000} 秒内就绪；`
              + "完整结构化结果仍保留在本次工具返回中。",
          ),
          element("p", "subtitle", "若数据稍后到达将自动刷新。"),
        );
        app.replaceChildren(panel);
        app.dataset.renderState = "degraded";
      };

      // 首屏只消费工具已经返回的数据，不等待 initialize，也不发网络请求。
      // 标准 MCP Apps 通知负责 Claude Desktop；openai:set_globals/toolOutput 是
      // 跨宿主的本地注入通道。桥接只影响后续按钮，不再决定首屏能否收工。
      window.addEventListener("openai:set_globals", (event) => {
        renderPayload(
          event.detail?.globals?.toolOutput
          || event.detail?.toolOutput
          || event.detail?.structuredContent,
          "openai-set-globals",
        );
      });
      if (window.openai?.toolOutput) {
        renderPayload(window.openai.toolOutput, "openai-tool-output");
      }
      setTimeout(renderLocalFallback, FIRST_RENDER_TIMEOUT_MS);
      bridgeReady = initialize().catch(() => null);
    })();
  </script>
</body>
</html>
